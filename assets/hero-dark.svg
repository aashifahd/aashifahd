<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Aashif Ahamed, full-stack developer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#a371f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="260" rx="16"/></clipPath>
    <style>
      .orb { animation: drift 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .dot { animation: pulse 2.4s ease-in-out infinite; transform-origin: 668px 214px; }
      @keyframes drift { to { transform: translate(-90px, 40px); } }
      @keyframes drift2 { to { transform: translate(80px, -30px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .orb, .orb2, .cursor, .dot { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="#0d1117"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <circle class="orb" cx="760" cy="60" r="220" fill="url(#orb1)"/>
    <circle class="orb2" cx="120" cy="250" r="200" fill="url(#orb2)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#30363d"/>

  <text x="56" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8b949e">~/aashifahd <tspan fill="#58a6ff">$</tspan> whoami<tspan class="cursor" fill="#58a6ff">▍</tspan></text>
  <text x="54" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">Aashif Ahamed</text>
  <text x="56" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">Full-stack developer building <tspan fill="url(#g)" font-weight="700">SaaS, AI agents</tspan> and <tspan fill="url(#g)" font-weight="700">dev tools</tspan></text>

  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
    <rect x="56" y="198" width="184" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="148" y="218" text-anchor="middle" fill="#e6edf3">Founder, CenoDigital</text>
    <rect x="250" y="198" width="110" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="305" y="218" text-anchor="middle" fill="#e6edf3">Sri Lanka</text>
    <rect x="370" y="198" width="214" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <text x="477" y="218" text-anchor="middle" fill="#e6edf3">TypeScript · PHP · Python</text>
  </g>

  <g>
    <rect x="652" y="198" width="196" height="30" rx="15" fill="#21262d" stroke="#30363d"/>
    <circle class="dot" cx="668" cy="213" r="5" fill="#3fb950"/>
    <text x="682" y="218" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e6edf3">Open to new projects</text>
  </g>
</svg>
